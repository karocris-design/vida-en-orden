<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Proyectos" />
  <meta name="robots" content="noindex, nofollow" />
  <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png" />
  <link rel="icon" type="image/png" sizes="180x180" href="./apple-touch-icon.png" />
  <title>Mis Proyectos — Kanban</title>
  <style>
    :root {
      --bg: #f6f5f2;
      --card: #ffffff;
      --card-inner: #faf9f6;
      --border: #e5e7eb;
      --fg: #18181b;
      --muted: #52525b;
      --accent: #2563eb;
      --accent-fg: #ffffff;
      --inst-bg: #eff6ff;
      --inst-bd: #bfdbfe;
      --ok: #16a34a;
      --warn-bg: #fef3c7;
      --warn-bd: #fde68a;
      --warn-fg: #92400e;
      --c1: #0f766e;
      --c2: #2563eb;
      --c3: #7c3aed;
      --c4: #c2410c;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0c0e12;
        --card: #161922;
        --card-inner: #10131a;
        --border: #272c38;
        --fg: #f4f4f5;
        --muted: #a1a1aa;
        --accent: #60a5fa;
        --accent-fg: #0c0e12;
        --inst-bg: #13203d;
        --inst-bd: #1e3a8a;
        --ok: #22c55e;
        --warn-bg: #451a03;
        --warn-bd: #78350f;
        --warn-fg: #fde68a;
        --c1: #2dd4bf;
        --c2: #60a5fa;
        --c3: #a78bfa;
        --c4: #fb923c;
      }
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0;
      padding: calc(14px + env(safe-area-inset-top)) 14px calc(36px + env(safe-area-inset-bottom));
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--fg);
      line-height: 1.45;
    }
    .wrap { max-width: 1440px; margin: 0 auto; }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
      flex-wrap: wrap;
    }
    h1 { font-size: 21px; font-weight: 800; margin: 0; letter-spacing: -0.02em; }
    .meta { font-size: 12px; color: var(--muted); margin-top: 2px; }
    .head-actions { display: flex; gap: 8px; flex-shrink: 0; }
    .btn {
      padding: 9px 14px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--fg);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      flex-shrink: 0;
    }
    .btn-primary {
      background: var(--accent);
      color: var(--accent-fg);
      border-color: transparent;
    }
    .btn:active { opacity: 0.8; transform: scale(0.98); }
    .filters {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 10px;
      margin-bottom: 10px;
      scrollbar-width: none;
    }
    .filters::-webkit-scrollbar { display: none; }
    .chip {
      padding: 7px 14px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--muted);
      font-size: 13px;
      font-weight: 600;
      white-space: nowrap;
      cursor: pointer;
    }
    .chip.active {
      background: var(--accent);
      color: var(--accent-fg);
      border-color: transparent;
    }

    /* Main Layout: Kanban + Right Notes Sidebar */
    .layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 320px;
      gap: 16px;
      align-items: start;
    }
    @media (max-width: 1120px) {
      .layout { grid-template-columns: 1fr; }
    }

    .board {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
      align-items: start;
    }
    @media (max-width: 1320px) {
      .board { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    @media (max-width: 680px) {
      .board { grid-template-columns: 1fr; }
    }
    .col {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 13px;
      display: flex;
      flex-direction: column;
      gap: 11px;
    }
    .col-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      padding-bottom: 9px;
      border-bottom: 1px solid var(--border);
    }
    .col-title {
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 14px;
      font-weight: 800;
      margin: 0;
    }
    .col-desc { font-size: 11px; color: var(--muted); margin-top: 2px; }
    .count {
      font-size: 12px;
      font-weight: 700;
      padding: 2px 9px;
      border-radius: 999px;
      background: var(--card-inner);
      border: 1px solid var(--border);
      color: var(--muted);
      font-variant-numeric: tabular-nums;
    }
    .dot { width: 9px; height: 9px; border-radius: 999px; flex-shrink: 0; }
    .card {
      background: var(--card-inner);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 13px;
      display: flex;
      flex-direction: column;
      gap: 9px;
    }
    .card-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
    .card-name { display: flex; align-items: center; gap: 7px; font-size: 14px; font-weight: 800; margin: 0; }
    .card-date { font-size: 11px; color: var(--muted); margin-top: 2px; }
    .pct { font-size: 16px; font-weight: 800; font-variant-numeric: tabular-nums; flex-shrink: 0; }
    .bar { height: 6px; background: var(--border); border-radius: 999px; overflow: hidden; }
    .fill { height: 100%; border-radius: 999px; }
    .box-inst {
      background: var(--inst-bg);
      border: 1px solid var(--inst-bd);
      border-radius: 10px;
      padding: 8px 10px;
    }
    .box-warn {
      background: var(--warn-bg);
      border: 1px solid var(--warn-bd);
      color: var(--warn-fg);
      border-radius: 10px;
      padding: 8px 10px;
      font-size: 12px;
    }
    .box-next {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 8px 10px;
    }
    .lbl {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.03em;
      color: var(--muted);
      margin-bottom: 3px;
    }
    .box-inst .lbl { color: var(--accent); }
    .box-inst p { margin: 0; font-size: 13px; font-weight: 600; color: var(--fg); }
    .txt { margin: 0; font-size: 13px; color: var(--muted); }
    .box-next p { margin: 0; font-size: 13px; color: var(--fg); }
    .empty {
      border: 1px dashed var(--border);
      border-radius: 12px;
      padding: 18px 10px;
      text-align: center;
      font-size: 12px;
      color: var(--muted);
    }

    /* Notes Sidebar */
    .notes-panel {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 15px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      position: sticky;
      top: 14px;
    }
    .notes-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      padding-bottom: 9px;
      border-bottom: 1px solid var(--border);
    }
    .notes-head h2 { font-size: 15px; font-weight: 800; margin: 0; }
    .note-form { display: flex; flex-direction: column; gap: 8px; }
    .note-select, .note-input {
      width: 100%;
      padding: 9px 11px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--card-inner);
      color: var(--fg);
      font-family: inherit;
      font-size: 13px;
    }
    .note-input { resize: vertical; min-height: 68px; }
    .note-list { display: flex; flex-direction: column; gap: 8px; }
    .note-item {
      background: var(--card-inner);
      border: 1px solid var(--border);
      border-radius: 11px;
      padding: 10px;
      display: flex;
      align-items: flex-start;
      gap: 8px;
    }
    .note-item.done { opacity: 0.6; }
    .note-item input[type="checkbox"] { margin-top: 3px; width: 16px; height: 16px; accent-color: var(--accent); flex-shrink: 0; }
    .note-body { flex: 1; min-width: 0; }
    .note-meta { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-bottom: 3px; }
    .note-tag {
      font-size: 10px;
      font-weight: 700;
      padding: 1px 7px;
      border-radius: 999px;
      background: var(--inst-bg);
      color: var(--accent);
      border: 1px solid var(--inst-bd);
    }
    .note-time { font-size: 10px; color: var(--muted); }
    .note-text { margin: 0; font-size: 13px; color: var(--fg); word-break: break-word; }
    .note-item.done .note-text { text-decoration: line-through; color: var(--muted); }
    .note-del {
      background: none;
      border: none;
      color: var(--muted);
      font-size: 14px;
      cursor: pointer;
      padding: 0 3px;
      line-height: 1;
    }
    .notes-footer {
      display: flex;
      gap: 8px;
      padding-top: 8px;
      border-top: 1px solid var(--border);
    }
    .notes-footer .btn { flex: 1; text-align: center; padding: 9px 10px; font-size: 12px; }
    .toast {
      position: fixed;
      bottom: 20px;
      right: 16px;
      background: var(--fg);
      color: var(--bg);
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 600;
      display: none;
      z-index: 99;
    }
    .err-bar {
      background: var(--warn-bg);
      color: var(--warn-fg);
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 12px;
      margin-bottom: 12px;
    }
    .center-msg { text-align: center; color: var(--muted); padding: 48px 16px; font-size: 14px; }
  </style>
</head>
<body>
  <div id="root" class="wrap">
    <div class="center-msg">Cargando tu tablero desde Google Sheets...</div>
  </div>
  <div id="toast" class="toast"></div>

  <script>
    (function () {
      const SHEET_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQQvAqRtPj_lLBGKCvmbcWI3wLH4lWmuTjyJDMoUFYXm4DWfJqzNTVH6kmYKt-qrTUp8caF68bpBpg8/pub?output=csv';
      const CACHE_KEY = 'kanban_sheet_cache_v1';
      const NOTES_KEY = 'kanban_quick_notes_v1';

      const COLUMNS = [
        { id: 'Listo hoy', title: '⚡ Listo hoy', desc: 'Puedes avanzar ahora', dot: 'var(--ok)' },
        { id: 'En marcha', title: '⚙️ En marcha', desc: 'Avanzando o en proceso', dot: 'var(--accent)' },
        { id: 'En espera', title: '⏸️ En espera', desc: 'En pausa o por límite', dot: '#d97706' },
        { id: 'Entregado', title: '✅ Entregado', desc: 'Bloque cerrado', dot: 'var(--muted)' }
      ];

      const GROUP_COLORS = {
        'VIDA EN ORDEN': 'var(--c1)',
        'EducArte': 'var(--c2)',
        'Motivación': 'var(--c3)'
      };
      const FALLBACK_COLORS = ['var(--c1)', 'var(--c2)', 'var(--c3)', 'var(--c4)'];

      let currentRows = [];
      let selectedGroup = 'Todos';
      let lastSyncLabel = '';
      let lastError = '';
      let notes = loadNotes();

      function esc(s) {
        return String(s || '')
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;');
      }

      function showToast(msg) {
        const el = document.getElementById('toast');
        el.textContent = msg;
        el.style.display = 'block';
        clearTimeout(el._t);
        el._t = setTimeout(() => { el.style.display = 'none'; }, 2200);
      }

      function loadNotes() {
        try {
          const raw = localStorage.getItem(NOTES_KEY);
          if (raw) return JSON.parse(raw);
        } catch (_) {}
        return [];
      }

      function saveNotes() {
        try { localStorage.setItem(NOTES_KEY, JSON.stringify(notes)); } catch (_) {}
      }

      function copyText(text, okMsg) {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(text).then(() => showToast(okMsg)).catch(() => fallbackCopy(text, okMsg));
        } else {
          fallbackCopy(text, okMsg);
        }
      }

      function fallbackCopy(text, okMsg) {
        const ta = document.createElement('textarea');
        ta.value = text;
        document.body.appendChild(ta);
        ta.select();
        try { document.execCommand('copy'); showToast(okMsg); } catch (_) { showToast('No se pudo copiar'); }
        document.body.removeChild(ta);
      }

      function parseCSV(text) {
        const rows = [];
        let row = [];
        let field = '';
        let inQuotes = false;
        const clean = text.replace(/^\uFEFF/, '');

        for (let i = 0; i < clean.length; i++) {
          const ch = clean[i];
          const next = clean[i + 1];
          if (inQuotes) {
            if (ch === '"' && next === '"') {
              field += '"';
              i++;
            } else if (ch === '"') {
              inQuotes = false;
            } else {
              field += ch;
            }
          } else {
            if (ch === '"') {
              inQuotes = true;
            } else if (ch === ',') {
              row.push(field);
              field = '';
            } else if (ch === '\r' && next === '\n') {
              row.push(field);
              rows.push(row);
              row = [];
              field = '';
              i++;
            } else if (ch === '\n' || ch === '\r') {
              row.push(field);
              rows.push(row);
              row = [];
              field = '';
            } else {
              field += ch;
            }
          }
        }
        if (field.length > 0 || row.length > 0) {
          row.push(field);
          rows.push(row);
        }
        if (rows.length < 2) return [];

        const headers = rows[0].map(h => h.trim().toLowerCase());
        return rows.slice(1)
          .filter(r => r.some(cell => cell && cell.trim() !== ''))
          .map(r => {
            const obj = {};
            headers.forEach((h, idx) => { obj[h] = (r[idx] || '').trim(); });
            return obj;
          });
      }

      function normalizeColumn(val) {
        const v = String(val || '').trim().toLowerCase();
        if (v.includes('listo') || v.includes('hacer')) return 'Listo hoy';
        if (v.includes('marcha') || v.includes('curso') || v.includes('proceso')) return 'En marcha';
        if (v.includes('espera') || v.includes('pausa') || v.includes('bloque')) return 'En espera';
        if (v.includes('entreg') || v.includes('cerrad') || v.includes('termin')) return 'Entregado';
        return 'En marcha';
      }

      function pickColor(item, idx) {
        if (String(item.proyecto || '').toLowerCase().includes('reel')) return 'var(--c4)';
        return GROUP_COLORS[item.grupo] || FALLBACK_COLORS[idx % FALLBACK_COLORS.length];
      }

      function renderNotesSection() {
        const openCount = notes.filter(n => !n.done).length;
        const listHtml = notes.length ? notes.map((n, idx) => `
          <div class="note-item ${n.done ? 'done' : ''}">
            <input type="checkbox" data-note-toggle="${idx}" ${n.done ? 'checked' : ''} />
            <div class="note-body">
              <div class="note-meta">
                <span class="note-tag">${esc(n.tag)}</span>
                <span class="note-time">${esc(n.at)}</span>
              </div>
              <p class="note-text">${esc(n.text)}</p>
            </div>
            <button type="button" class="note-del" data-note-del="${idx}" aria-label="Borrar">✕</button>
          </div>
        `).join('') : `<div class="empty">Anota aquí ideas o pendientes rápidos para luego pegarlos en el chat.</div>`;

        return `
          <aside id="notes-anchor" class="notes-panel">
            <div class="notes-head">
              <h2>📝 Notas rápidas</h2>
              <span class="count">${openCount}</span>
            </div>
            <form id="note-form" class="note-form">
              <select id="note-tag" class="note-select">
                <option value="General">General</option>
                <option value="Motivación">Motivación</option>
                <option value="EducArte">EducArte</option>
                <option value="VIDA EN ORDEN">VIDA EN ORDEN</option>
              </select>
              <textarea id="note-text" class="note-input" placeholder="Escribe una idea, ajuste o recordatorio..."></textarea>
              <button type="submit" class="btn btn-primary">Guardar nota</button>
            </form>
            <div class="note-list">${listHtml}</div>
            ${notes.length ? `
              <div class="notes-footer">
                <button type="button" id="btn-copy-notes" class="btn btn-primary">📋 Copiar para el chat</button>
                <button type="button" id="btn-clear-done" class="btn">Limpiar hechas</button>
              </div>
            ` : ''}
          </aside>
        `;
      }

      function render() {
        const groups = ['Todos'];
        currentRows.forEach(r => {
          if (r.grupo && !groups.includes(r.grupo)) groups.push(r.grupo);
        });

        const visible = selectedGroup === 'Todos'
          ? currentRows
          : currentRows.filter(r => r.grupo === selectedGroup);

        const filtersHtml = groups.map(g =>
          `<button type="button" data-group="${esc(g)}" class="chip ${g === selectedGroup ? 'active' : ''}">${esc(g)}</button>`
        ).join('');

        const boardHtml = COLUMNS.map(col => {
          const items = visible.filter(r => normalizeColumn(r.columna) === col.id);
          const cardsHtml = items.length ? items.map((c, idx) => {
            const pct = Math.max(0, Math.min(100, parseInt(c.avance, 10) || 0));
            const color = pickColor(c, idx);
            return `
              <article class="card">
                <div class="card-top">
                  <div>
                    <h3 class="card-name">
                      <span class="dot" style="background:${color}"></span>
                      <span>${esc(c.proyecto)}</span>
                    </h3>
                    <div class="card-date">${esc(c.fecha)}</div>
                  </div>
                  <div class="pct" style="color:${color}">${pct}%</div>
                </div>
                <div class="bar"><div class="fill" style="width:${pct}%;background:${color}"></div></div>
                <div class="box-inst">
                  <div class="lbl">Último que pediste</div>
                  <p>${esc(c.ultima_instruccion)}</p>
                </div>
                ${c.bloqueo ? `<div class="box-warn"><b>Pausa:</b> ${esc(c.bloqueo)}</div>` : ''}
                <div>
                  <div class="lbl">Qué hicimos</div>
                  <p class="txt">${esc(c.que_hicimos)}</p>
                </div>
                <div class="box-next">
                  <div class="lbl">Qué sigue</div>
                  <p>${esc(c.que_sigue)}</p>
                </div>
              </article>
            `;
          }).join('') : `<div class="empty">Nada aquí por ahora</div>`;

          return `
            <section class="col">
              <div class="col-head">
                <div>
                  <h2 class="col-title">
                    <span class="dot" style="background:${col.dot}"></span>
                    <span>${col.title}</span>
                  </h2>
                  <div class="col-desc">${col.desc}</div>
                </div>
                <span class="count">${items.length}</span>
              </div>
              ${cardsHtml}
            </section>
          `;
        }).join('');

        const openNotes = notes.filter(n => !n.done).length;

        document.getElementById('root').innerHTML = `
          <header>
            <div>
              <h1>Mis Proyectos</h1>
              <div class="meta">${esc(lastSyncLabel || 'Conectado a tu Google Sheet')}</div>
            </div>
            <div class="head-actions">
              <button id="btn-jump-notes" type="button" class="btn">📝 Notas (${openNotes})</button>
              <button id="btn-refresh" type="button" class="btn btn-primary">↻ Actualizar</button>
            </div>
          </header>
          ${lastError ? `<div class="err-bar">${esc(lastError)}</div>` : ''}
          <div class="filters">${filtersHtml}</div>
          <div class="layout">
            <main class="board">${boardHtml}</main>
            ${renderNotesSection()}
          </div>
        `;

        document.getElementById('btn-refresh').addEventListener('click', loadFromSheet);
        document.getElementById('btn-jump-notes').addEventListener('click', () => {
          const el = document.getElementById('notes-anchor');
          if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
        });

        document.querySelectorAll('[data-group]').forEach(btn => {
          btn.addEventListener('click', () => {
            selectedGroup = btn.dataset.group;
            render();
          });
        });

        const form = document.getElementById('note-form');
        if (form) {
          form.addEventListener('submit', e => {
            e.preventDefault();
            const txtEl = document.getElementById('note-text');
            const tagEl = document.getElementById('note-tag');
            const text = txtEl.value.trim();
            if (!text) return;
            const now = new Date();
            const at = now.toLocaleDateString('es-MX', { day: 'numeric', month: 'short' }) + ' · ' +
                       now.toLocaleTimeString('es-MX', { hour: '2-digit', minute: '2-digit' });
            notes.unshift({ tag: tagEl.value, text, at, done: false });
            saveNotes();
            render();
            showToast('Nota guardada');
          });
        }

        document.querySelectorAll('[data-note-toggle]').forEach(cb => {
          cb.addEventListener('change', () => {
            const idx = Number(cb.dataset.noteToggle);
            if (notes[idx]) {
              notes[idx].done = cb.checked;
              saveNotes();
              render();
            }
          });
        });

        document.querySelectorAll('[data-note-del]').forEach(btn => {
          btn.addEventListener('click', () => {
            const idx = Number(btn.dataset.noteDel);
            notes.splice(idx, 1);
            saveNotes();
            render();
            showToast('Nota eliminada');
          });
        });

        const copyBtn = document.getElementById('btn-copy-notes');
        if (copyBtn) {
          copyBtn.addEventListener('click', () => {
            const pending = notes.filter(n => !n.done);
            const target = pending.length ? pending : notes;
            const lines = ['Aquí van mis notas rápidas del tablero para seguirle:', ''];
            target.forEach(n => lines.push(`• [${n.tag}] ${n.text} (${n.at})`));
            copyText(lines.join('\n'), 'Notas copiadas listas para pegar en el chat');
          });
        }

        const clearBtn = document.getElementById('btn-clear-done');
        if (clearBtn) {
          clearBtn.addEventListener('click', () => {
            notes = notes.filter(n => !n.done);
            saveNotes();
            render();
            showToast('Notas hechas limpiadas');
          });
        }
      }

      async function loadFromSheet() {
        try {
          const cached = localStorage.getItem(CACHE_KEY);
          if (cached && currentRows.length === 0) {
            currentRows = JSON.parse(cached);
            lastSyncLabel = 'Actualizando desde tu hoja...';
            render();
          }
        } catch (_) {}

        try {
          const res = await fetch(SHEET_CSV_URL + '&_t=' + Date.now(), {
            method: 'GET',
            credentials: 'omit',
            cache: 'no-store'
          });
          if (!res.ok) throw new Error('HTTP ' + res.status);
          const csvText = await res.text();
          const parsed = parseCSV(csvText);
          if (!parsed.length) throw new Error('Hoja vacía');
          currentRows = parsed;
          lastError = '';
          const hora = new Date().toLocaleTimeString('es-MX', { hour: '2-digit', minute: '2-digit' });
          lastSyncLabel = 'En vivo desde Google Sheets · ' + hora;
          try { localStorage.setItem(CACHE_KEY, JSON.stringify(parsed)); } catch (_) {}
          render();
        } catch (err) {
          lastError = 'No se pudo actualizar ahora (' + err.message + ').';
          if (currentRows.length) {
            lastSyncLabel = 'Mostrando última copia guardada';
            render();
          } else {
            document.getElementById('root').innerHTML =
              '<div class="center-msg">No se pudo leer tu Google Sheet (' + esc(err.message) + ').<br><br><button class="btn btn-primary" onclick="location.reload()">Reintentar</button></div>';
          }
        }
      }

      loadFromSheet();
    })();
  </script>
</body>
</html>
