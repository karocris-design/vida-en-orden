<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Proyectos" />
  <meta name="robots" content="noindex, nofollow" />
  <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='40' fill='%231d4ed8'/%3E%3Crect x='36' y='44' width='48' height='40' rx='10' fill='%23ffffff'/%3E%3Crect x='96' y='44' width='48' height='40' rx='10' fill='%2393c5fd'/%3E%3Crect x='36' y='96' width='48' height='40' rx='10' fill='%2393c5fd'/%3E%3Crect x='96' y='96' width='48' height='40' rx='10' fill='%23ffffff'/%3E%3C/svg%3E" />
  <title>Centro de Mando</title>
  <style>
    :root {
      --bg: #f6f5f2;
      --card: #ffffff;
      --border: #e5e7eb;
      --fg: #18181b;
      --muted: #52525b;
      --accent: #2563eb;
      --accent-fg: #ffffff;
      --inst-bg: #eff6ff;
      --inst-bd: #bfdbfe;
      --next-bg: #fafafa;
      --ok-bg: #dcfce7;
      --ok-fg: #166534;
      --warn-bg: #fef3c7;
      --warn-fg: #92400e;
      --err-bg: #fee2e2;
      --err-fg: #991b1b;
      --c1: #0f766e;
      --c2: #2563eb;
      --c3: #7c3aed;
      --c4: #c2410c;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0c0e12;
        --card: #161922;
        --border: #272c38;
        --fg: #f4f4f5;
        --muted: #a1a1aa;
        --accent: #60a5fa;
        --accent-fg: #0c0e12;
        --inst-bg: #13203d;
        --inst-bd: #1e3a8a;
        --next-bg: #11141c;
        --ok-bg: #14532d;
        --ok-fg: #bbf7d0;
        --warn-bg: #451a03;
        --warn-fg: #fde68a;
        --err-bg: #450a0a;
        --err-fg: #fecaca;
        --c1: #2dd4bf;
        --c2: #60a5fa;
        --c3: #a78bfa;
        --c4: #fb923c;
      }
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0;
      padding: calc(14px + env(safe-area-inset-top)) 14px calc(32px + env(safe-area-inset-bottom));
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--fg);
      line-height: 1.45;
    }
    .wrap { max-width: 980px; margin: 0 auto; }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
    }
    h1 { font-size: 21px; font-weight: 800; margin: 0; letter-spacing: -0.02em; }
    .meta { font-size: 12px; color: var(--muted); margin-top: 2px; }
    .actions { display: flex; gap: 8px; flex-shrink: 0; }
    .btn {
      padding: 9px 13px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--fg);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-primary {
      background: var(--accent);
      color: var(--accent-fg);
      border-color: transparent;
    }
    .btn:active { opacity: 0.78; transform: scale(0.98); }
    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 14px;
    }
    .stat {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 13px;
      padding: 10px 12px;
    }
    .stat-lbl { font-size: 11px; color: var(--muted); }
    .stat-val { font-size: 18px; font-weight: 800; font-variant-numeric: tabular-nums; margin-top: 2px; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(310px, 1fr));
      gap: 14px;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
    .title-wrap { min-width: 0; }
    .title-row { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; }
    .dot { width: 9px; height: 9px; border-radius: 999px; flex-shrink: 0; }
    h2 { font-size: 17px; font-weight: 700; margin: 0; }
    .phase { font-size: 12px; color: var(--muted); margin-top: 3px; }
    .right { text-align: right; flex-shrink: 0; }
    .pill {
      display: inline-block;
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.03em;
      padding: 2px 8px;
      border-radius: 999px;
    }
    .pill.ok { background: var(--ok-bg); color: var(--ok-fg); }
    .pill.warn { background: var(--warn-bg); color: var(--warn-fg); }
    .pill.err { background: var(--err-bg); color: var(--err-fg); }
    .pct { font-size: 20px; font-weight: 800; font-variant-numeric: tabular-nums; margin-top: 3px; }
    .bar { height: 6px; background: var(--border); border-radius: 999px; overflow: hidden; }
    .fill { height: 100%; border-radius: 999px; transition: width 0.3s ease; }
    .lbl {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.04em;
      color: var(--muted);
      margin-bottom: 4px;
      text-transform: uppercase;
    }
    .inst {
      background: var(--inst-bg);
      border: 1px solid var(--inst-bd);
      border-radius: 12px;
      padding: 11px 12px;
    }
    .inst .lbl { color: var(--accent); display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
    .inst p { margin: 0; font-size: 14px; font-weight: 600; color: var(--fg); }
    .blocker {
      background: var(--warn-bg);
      color: var(--warn-fg);
      border-radius: 10px;
      padding: 9px 11px;
      font-size: 12px;
    }
    .blk p, .next p { margin: 0; font-size: 13px; }
    .blk p { color: var(--muted); }
    .next {
      background: var(--next-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px 12px;
    }
    details {
      border-top: 1px solid var(--border);
      padding-top: 10px;
      font-size: 12px;
      color: var(--muted);
    }
    summary {
      cursor: pointer;
      font-weight: 600;
      color: var(--accent);
      list-style: none;
    }
    summary::-webkit-details-marker { display: none; }
    .sub-lbl { font-weight: 700; color: var(--fg); margin: 10px 0 4px; }
    ul { margin: 0 0 0 16px; padding: 0; }
    li { margin-bottom: 4px; }
    .links { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 8px; }
    .links a { color: var(--accent); text-decoration: none; font-weight: 600; }
    .setup-card {
      max-width: 460px;
      margin: 40px auto;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 22px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    label { font-size: 12px; font-weight: 600; color: var(--muted); display: block; margin-bottom: 5px; }
    input {
      width: 100%;
      padding: 11px 12px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--fg);
      font-size: 14px;
    }
    .err-banner {
      background: var(--err-bg);
      color: var(--err-fg);
      border-radius: 12px;
      padding: 12px 14px;
      font-size: 13px;
      margin-bottom: 14px;
    }
    .muted-center { text-align: center; color: var(--muted); padding: 40px 16px; font-size: 14px; }
  </style>
</head>
<body>
  <div id="root" class="wrap"></div>

  <script>
    (function () {
      const CFG_KEY = 'mando_viewer_cfg_v1';
      const CACHE_KEY = 'mando_viewer_cache_v1';
      const COLORS = ['var(--c1)', 'var(--c2)', 'var(--c3)', 'var(--c4)'];

      function esc(s) {
        return String(s || '')
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;');
      }

      function formatDate(iso) {
        if (!iso) return '';
        try {
          const d = new Date(iso);
          const m = ['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
          const p = n => (n < 10 ? '0' + n : '' + n);
          return d.getDate() + ' ' + m[d.getMonth()] + ' · ' + p(d.getHours()) + ':' + p(d.getMinutes());
        } catch (_) {
          return String(iso).slice(0, 16).replace('T', ' ');
        }
      }

      function parseHashConfig() {
        const hash = window.location.hash ? window.location.hash.slice(1) : '';
        if (!hash) return null;
        const params = new URLSearchParams(hash);
        const api = params.get('api');
        const k = params.get('k') || '';
        if (api) return { api: api.trim(), k: k.trim() };
        return null;
      }

      function loadConfig() {
        const fromHash = parseHashConfig();
        if (fromHash) {
          try { localStorage.setItem(CFG_KEY, JSON.stringify(fromHash)); } catch (_) {}
          return fromHash;
        }
        try {
          const raw = localStorage.getItem(CFG_KEY);
          if (raw) return JSON.parse(raw);
        } catch (_) {}
        return null;
      }

      function saveConfig(cfg) {
        try { localStorage.setItem(CFG_KEY, JSON.stringify(cfg)); } catch (_) {}
      }

      function loadCache() {
        try {
          const raw = localStorage.getItem(CACHE_KEY);
          if (raw) return JSON.parse(raw);
        } catch (_) {}
        return null;
      }

      function saveCache(payload) {
        try { localStorage.setItem(CACHE_KEY, JSON.stringify(payload)); } catch (_) {}
      }

      function renderSetup(errMsg) {
        const existing = loadConfig() || { api: '', k: '' };
        document.getElementById('root').innerHTML = `
          <form id="setup-form" class="setup-card">
            <div>
              <h1>Centro de Mando</h1>
              <div class="meta">Acceso privado · los datos se guardan solo en este dispositivo</div>
            </div>
            ${errMsg ? `<div class="err-banner">${esc(errMsg)}</div>` : ''}
            <div>
              <label for="inp-api">URL de tu Web App (/exec)</label>
              <input id="inp-api" type="url" required placeholder="https://script.google.com/macros/s/.../exec" value="${esc(existing.api)}" />
            </div>
            <div>
              <label for="inp-key">Clave de acceso</label>
              <input id="inp-key" type="password" required placeholder="Tu clave privada" value="${esc(existing.k)}" />
            </div>
            <button type="submit" class="btn btn-primary">Entrar y sincronizar</button>
          </form>
        `;
        document.getElementById('setup-form').addEventListener('submit', function (e) {
          e.preventDefault();
          const api = document.getElementById('inp-api').value.trim();
          const k = document.getElementById('inp-key').value.trim();
          if (!api) return;
          const cfg = { api, k };
          saveConfig(cfg);
          const hash = '#api=' + encodeURIComponent(api) + '&k=' + encodeURIComponent(k);
          try { history.replaceState(null, '', hash); } catch (_) {}
          startApp(cfg);
        });
      }

      function renderDashboard(data, statusText, errMsg) {
        const projects = Array.isArray(data && data.projects) ? data.projects : [];
        const avgPct = projects.length
          ? Math.round(projects.reduce((acc, p) => acc + Number(p.progress_pct || 0), 0) / projects.length)
          : 0;
        const activeCount = projects.filter(p => p.status === 'activo').length;

        const cardsHtml = projects.map(function (p, idx) {
          const pct = Number(p.progress_pct || 0);
          const color = COLORS[idx % COLORS.length];
          const tone = p.status === 'activo' ? 'ok' : (p.status === 'bloqueado' ? 'err' : 'warn');
          const done = (p.done_highlights || []).map(x => `<li>${esc(x)}</li>`).join('');
          const hist = (p.history || []).slice(0, 4).map(h =>
            `<li><b>${esc(formatDate(h.at))}:</b> ${esc(h.instruction)}</li>`
          ).join('');
          const links = (p.links || []).map(l =>
            `<a href="${esc(l.url)}" target="_blank" rel="noopener noreferrer">${esc(l.label)} ↗</a>`
          ).join('');
          const blocker = (p.blockers && String(p.blockers).trim())
            ? `<div class="blocker"><b>Atención:</b> ${esc(p.blockers)}</div>`
            : '';

          return `
            <article class="card">
              <div class="top">
                <div class="title-wrap">
                  <div class="title-row">
                    <span class="dot" style="background:${color}"></span>
                    <h2>${esc(p.name)}</h2>
                  </div>
                  <div class="phase">${esc(p.phase || p.category)}</div>
                </div>
                <div class="right">
                  <span class="pill ${tone}">${esc(p.status || 'activo')}</span>
                  <div class="pct" style="color:${color}">${pct}%</div>
                </div>
              </div>
              <div class="bar"><div class="fill" style="width:${pct}%;background:${color}"></div></div>
              <div class="inst">
                <div class="lbl">
                  <span>Última instrucción</span>
                  <span>${esc(formatDate(p.last_instruction_at))}</span>
                </div>
                <p>${esc(p.last_instruction)}</p>
              </div>
              ${blocker}
              <div class="blk">
                <div class="lbl">En qué vamos</div>
                <p>${esc(p.summary)}</p>
              </div>
              <div class="next">
                <div class="lbl">Siguiente decisión</div>
                <p>${esc(p.next_decision)}</p>
              </div>
              ${(done || hist || links) ? `
                <details>
                  <summary>Ver logros, historial y links</summary>
                  ${done ? `<div class="sub-lbl">Logros</div><ul>${done}</ul>` : ''}
                  ${hist ? `<div class="sub-lbl">Historial</div><ul>${hist}</ul>` : ''}
                  ${links ? `<div class="links">${links}</div>` : ''}
                </details>
              ` : ''}
            </article>
          `;
        }).join('');

        document.getElementById('root').innerHTML = `
          <header>
            <div>
              <h1>Mis Proyectos</h1>
              <div class="meta">${esc(statusText)}</div>
            </div>
            <div class="actions">
              <button id="btn-refresh" type="button" class="btn btn-primary">↻ Actualizar</button>
              <button id="btn-cfg" type="button" class="btn" aria-label="Configurar">⚙</button>
            </div>
          </header>
          ${errMsg ? `<div class="err-banner">${esc(errMsg)}</div>` : ''}
          <section class="stats">
            <div class="stat">
              <div class="stat-lbl">Proyectos</div>
              <div class="stat-val">${projects.length}</div>
            </div>
            <div class="stat">
              <div class="stat-lbl">Activos</div>
              <div class="stat-val">${activeCount}/${projects.length}</div>
            </div>
            <div class="stat">
              <div class="stat-lbl">Promedio</div>
              <div class="stat-val">${avgPct}%</div>
            </div>
          </section>
          <section class="grid">${cardsHtml || '<div class="muted-center">Sin proyectos todavía.</div>'}</section>
        `;

        document.getElementById('btn-refresh').addEventListener('click', function () {
          const cfg = loadConfig();
          if (cfg) fetchLive(cfg);
        });
        document.getElementById('btn-cfg').addEventListener('click', function () {
          renderSetup();
        });
      }

      async function fetchLive(cfg) {
        const cached = loadCache();
        if (cached && cached.projects) {
          renderDashboard(cached, 'Actualizando en vivo desde Drive...');
        } else {
          document.getElementById('root').innerHTML = '<div class="muted-center">Conectando con tu Google Drive...</div>';
        }

        const sep = cfg.api.includes('?') ? '&' : '?';
        const url = cfg.api + sep + 'k=' + encodeURIComponent(cfg.k || '') + '&format=json&_t=' + Date.now();

        try {
          const res = await fetch(url, {
            method: 'GET',
            credentials: 'omit',
            redirect: 'follow',
            cache: 'no-store'
          });
          if (!res.ok) throw new Error('HTTP ' + res.status);
          const text = await res.text();
          let data;
          try {
            data = JSON.parse(text);
          } catch (_) {
            throw new Error('La respuesta no fue JSON (verifica que tu clave ?k= coincida y el acceso sea "Cualquier usuario").');
          }
          saveCache(data);
          const hora = new Date().toLocaleTimeString('es-MX', { hour: '2-digit', minute: '2-digit' });
          renderDashboard(data, 'En vivo desde Drive · ' + hora);
        } catch (err) {
          if (cached && cached.projects) {
            renderDashboard(cached, 'Mostrando última copia guardada', 'No se pudo actualizar ahora: ' + err.message);
          } else {
            renderSetup('No se pudo conectar: ' + err.message);
          }
        }
      }

      function startApp(cfg) {
        if (!cfg || !cfg.api) {
          renderSetup();
          return;
        }
        fetchLive(cfg);
      }

      startApp(loadConfig());
    })();
  </script>
</body>
</html>
